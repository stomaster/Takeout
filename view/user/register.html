<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 奶茶外卖</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
<!-- 背景泡泡装饰 -->
<div class="bubble-background">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
</div>

<!-- 返回按钮 -->
<a href="user.html" class="back-btn">← 返回登录</a>

<!-- 注册容器 -->
<div class="register-container">
    <div class="register-header">
        <h1>🥤 加入奶茶家族</h1>
        <p>创建账号，开启美味之旅</p>
    </div>

    <!-- 注册表单 -->
    <form id="registerForm" class="register-form">
        <div class="form-group">
            <label for="username">用户名 *</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="请输入4-20位用户名（字母、数字、下划线）"
                   minlength="4"
                   maxlength="20"
                   required>
            <div class="hint">4-20位字母、数字或下划线</div>
            <div id="usernameError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="password">密码 *</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="请输入密码（至少6位）"
                   minlength="6"
                   maxlength="20"
                   required>
            <div class="hint">至少6位，建议包含字母和数字</div>
            <div id="passwordError" class="error-message"></div>
            <div id="passwordStrength" class="password-strength"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">确认密码 *</label>
            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   placeholder="请再次输入密码"
                   required>
            <div id="confirmError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="email">邮箱地址（可选）</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="请输入邮箱地址">
            <div class="hint">用于找回密码和接收订单通知</div>
            <div id="emailError" class="error-message"></div>
        </div>

        <div class="terms-group">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
            <label for="agreeTerms">
                我已阅读并同意
                <a href="#" class="terms-link" onclick="showTerms()">《用户协议》</a>
                和
                <a href="#" class="terms-link" onclick="showPrivacy()">《隐私政策》</a>
            </label>
            <div id="termsError" class="error-message"></div>
        </div>

        <button type="submit" class="register-btn" id="registerBtn">
            立即注册
        </button>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <span>注册中，请稍候...</span>
        </div>

        <div class="success-message" id="successMessage">
            <div class="success-icon">✓</div>
            <p>注册成功！正在跳转到登录页面...</p>
        </div>

        <div class="error-message general-error" id="generalError"></div>
    </form>

    <div class="login-link">
        已有账号？<a href="user.html">立即登录</a>
    </div>
</div>

<!-- 模态框容器（用于显示协议和隐私政策） -->
<div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle"></h2>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- 内容将通过JS动态加载 -->
        </div>
    </div>
</div>

<!-- 引入API库 -->
<script src="../first view/api.js"></script>
<!-- 注册逻辑 -->
<script src="register.js"></script>
</body>
</html>
