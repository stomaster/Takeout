<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="user.css">
  <title>用户登录</title>
  
</head>
<body>
<div class="login-container">
  <h2>用户登录</h2>
  <form id="login-form">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" placeholder="用户名">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    <button type="submit">登录</button>
    <div id="error-message" class="error"></div>
    <!-- 登录按钮的 div 结束后，加上这个（注意：这个 div 要和登录按钮的 div 同级） -->
    <div style="text-align: center; margin-top: 15px; font-size: 14px; clear: both;">
      没有账号？<a href="register.html" style="color: #007bff; text-decoration: none; font-weight: 500;">立即注册</a >
    </div>
  </form>
</div>


<!-- 引入API库 -->
<script src="../first view/api.js"></script>
<!-- 登录逻辑 -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');

    // 检查是否已登录
    if (API.isLoggedIn()) {
      // 如果已登录，直接跳转到主页面
      window.location.href = '../first view/view.html';
      return;
    }

    // 登录表单提交事件
    loginForm.addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorMessage.textContent = '请输入用户名和密码';
        return;
      }

      errorMessage.textContent = ''; // 清除错误信息

      try {
        // 显示加载状态
        const submitBtn = loginForm.querySelector('button');
        submitBtn.disabled = true;
        submitBtn.textContent = '登录中...';
        const response = await fetch('http://10.91.243.22:8081/api/users/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            username: username,  // 用email作为username
            password: password
          })
        });

        const result = await response.json();
        console.log('登录响应:', result);

        if (result.code === 200) {
          // 登录成功
          alert('登录成功！');

          // ✅ 正确保存用户信息
          API.setCurrentUser(result.data, result.data.token || 'mock-token');

          // ✅ 确保立即加载
          API.utils.loadUserFromStorage();

          // 跳转到主页面
          window.location.href = '../first view/view.html';
        } else {
          // 登录失败
          errorMessage.textContent = '登录失败: ' + (result.message || '用户名或密码错误');
        }

      } catch (error) {
        console.error('登录错误:', error);
        errorMessage.textContent = '网络错误，请检查连接';
      } finally {
        // 恢复按钮状态
        const submitBtn = loginForm.querySelector('button');
        submitBtn.disabled = false;
        submitBtn.textContent = '登录';
      }
    });
  });
</script>
</body>
</html>
